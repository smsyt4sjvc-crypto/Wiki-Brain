name: fragility dashboard

# Runs the credit/debt fragility feed on a schedule and COMMITS the numbers
# back into the repo. The commit is the point: the dashboard is readable by a
# person (docs/index.html) and by Claude (data/fragility/*.csv + latest.json)
# without either one needing to execute JavaScript or hold an API key.
#
# NOTE ON NETWORK: the runner has clean outbound access, so it reaches sources
# the agent container cannot. Do NOT add a User-Agent to the FRED calls --
# FRED bot-protects on UA and the default curl agent is what passes.

on:
  schedule:
    # 11:20 UTC = 07:20 ET during EDT. Weekdays only; markets are the point.
    # Deliberately not on the hour -- GitHub's scheduler is heavily contended at :00.
    - cron: '20 11 * * 1-5'
  workflow_dispatch:          # run it by hand whenever

permissions:
  contents: write

concurrency:
  group: fragility
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-vault
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch series
        run: python3 -u tools/fragility_feed.py
        # A single dead source must not fail the run -- the feed merges into the
        # CSVs on disk, so yesterday's value survives and the row reads STALE.
        continue-on-error: true

      - name: Score and render
        run: |
          python3 tools/fragility.py | tee fragility_report.txt
          python3 tools/fragility_html.py

      - name: Commit if anything changed
        run: |
          git config user.name  "fragility-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fragility docs/index.html
          if git diff --cached --quiet; then
            echo "no change -- nothing to commit"
          else
            git commit -m "fragility: $(date -u +%Y-%m-%d) feed refresh"
            for i in 1 2 3 4; do
              git push origin HEAD:${{ github.ref_name }} && break
              echo "push failed, retry $i"; sleep $((2**i))
            done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fragility-report
          path: research-vault/fragility_report.txt
